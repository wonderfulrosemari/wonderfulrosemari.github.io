<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="740" viewBox="0 0 1160 740" role="img" aria-labelledby="title desc">
  <title id="title">Journal Mate 요약·번역 생성과 원문 대조 검증</title>
  <desc id="desc">논문 2.1절과 2.3절의 두 핵심 에이전트 구조. 추출된 웹·PDF 원문으로 Summarizer가 요약과 번역을 생성한다. Verifier는 원문과 생성 결과를 대조하여 의미 보존, 사실 정확성, 논리 일관성을 검토하고 필요 시 재요약·재번역을 요청한다. 검토 후 결과는 Side Panel에 표시된다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#34584b"/></marker>
    <marker id="feedback" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10Z" fill="#93703a"/></marker>
  </defs>
  <rect width="1160" height="740" fill="#faf9f6"/>
  <g font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif" fill="#252923">
    <text x="40" y="66" font-size="34" font-weight="700">요약·번역 생성과 원문 대조 검증</text>
    <text x="40" y="105" font-size="22" fill="#62675f">Journal Mate · 논문에 기술된 두 핵심 에이전트의 협업 구조</text>

    <rect x="40" y="155" width="330" height="110" rx="12" fill="#fff" stroke="#c9cec5" stroke-width="2"/>
    <text x="64" y="198" font-size="27" font-weight="700">웹페이지 · PDF 입력</text>
    <text x="64" y="235" font-size="22" fill="#62675f">본문 텍스트 추출 · 전처리</text>

    <g fill="none" stroke="#34584b" stroke-width="3" marker-end="url(#arrow)">
      <path d="M205 265V330"/>
      <path d="M370 210H645V330"/>
      <path d="M370 430H480"/>
      <path d="M810 430H900"/>
    </g>
    <text x="422" y="194" font-size="22" fill="#34584b">원문 전달 · 검증 기준</text>
    <text x="425" y="395" text-anchor="middle" font-size="21" fill="#34584b">생성 결과</text>
    <text x="855" y="395" text-anchor="middle" font-size="21" fill="#34584b">검토 후</text>

    <rect x="40" y="330" width="330" height="200" rx="12" fill="#fff" stroke="#789085" stroke-width="2"/>
    <text x="64" y="372" font-size="24" fill="#34584b">Summarizer Agent</text>
    <text x="64" y="415" font-size="29" font-weight="700">요약 · 번역 생성</text>
    <text x="64" y="457" font-size="22" fill="#62675f">원문의 핵심 내용 요약</text>
    <text x="64" y="493" font-size="22" fill="#62675f">자연스러운 한국어 번역</text>

    <rect x="480" y="330" width="330" height="200" rx="12" fill="#edf3ef" stroke="#789085" stroke-width="2"/>
    <text x="504" y="372" font-size="24" fill="#34584b">Verifier Agent</text>
    <text x="504" y="415" font-size="29" font-weight="700">원문과 대조 검증</text>
    <text x="504" y="457" font-size="22" fill="#62675f">핵심 의미 보존 · 사실 정확성</text>
    <text x="504" y="493" font-size="22" fill="#62675f">논리적 일관성 검토</text>

    <rect x="900" y="330" width="220" height="200" rx="12" fill="#fff" stroke="#c9cec5" stroke-width="2"/>
    <text x="1010" y="399" text-anchor="middle" font-size="29" font-weight="700">결과 표시</text>
    <text x="1010" y="444" text-anchor="middle" font-size="23" fill="#62675f">Chrome</text>
    <text x="1010" y="479" text-anchor="middle" font-size="23" fill="#62675f">Side Panel</text>

    <path d="M645 530V620H205V530" fill="none" stroke="#93703a" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#feedback)"/>
    <text x="425" y="597" text-anchor="middle" font-size="23" fill="#805e2c">보완 필요 시 재요약 · 재번역 요청</text>
    <text x="425" y="656" text-anchor="middle" font-size="21" fill="#62675f">검토 의견 반영 → 결과 갱신 → 재검증</text>
    <text x="40" y="709" font-size="20" fill="#62675f">요약·번역·검증은 세 기능이며, 논문은 생성 담당과 검증 담당의 두 핵심 에이전트로 설명합니다.</text>
  </g>
</svg>
